<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Quiz</title>
    <link rel="stylesheet" href="{% static 'css/quiz_page.css' %}">
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <img src="{% static 'images/SMD_logo.jpeg' %}" alt="SMD_logo" class="logo">
            <h1>INTERFEST</h1>
            <div class="timer" id="timer">30</div>
        </div>

        <div class="question-box">
            <h2 id="question">Loading question...</h2>
        </div>

        <div class="options">
            <button id="option1" class="option">Option 1</button>
            <button id="option2" class="option">Option 2</button>
            <button id="option3" class="option">Option 3</button>
            <button id="option4" class="option">Option 4</button>
        </div>        

        <button id="submitBtn" onclick="submitAnswer()">Submit</button>
    </div>
    <script src="{% static 'js/quiz_page.js' %}" ></script>
</body>
</html>
